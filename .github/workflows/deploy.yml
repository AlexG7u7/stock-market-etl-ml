name: Deploy to Windows Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    
    steps:
      - name: Pull latest changes
        run: |
          cd C:\Projects\stock-market
          git fetch origin
          git reset --hard origin/main
          Write-Host "✅ Codigo actualizado desde GitHub" -ForegroundColor Green
          git log --oneline -1
        shell: powershell
