name: Refresh Market Data (legacy)

# Preferir: .github/workflows/data-ingest.yml (cron automático)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline'
        default: 'all-skip-sql'
        type: choice
        options:
          - all-skip-sql
          - ohlcv-news-intraday
          - news-only

env:
  PYTHON_VERSION: '3.11'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Ingest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_NEWS_ENABLED: 'true'
          DATABURSATIL_API_TOKEN: ${{ secrets.DATABURSATIL_API_TOKEN }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
        run: |
          case "${{ github.event.inputs.mode }}" in
            ohlcv-news-intraday) ARGS="--ohlcv --news --intraday" ;;
            news-only) ARGS="--news" ;;
            *) ARGS="--all --skip-sql" ;;
          esac
          python scripts/run_all_ingests.py $ARGS
