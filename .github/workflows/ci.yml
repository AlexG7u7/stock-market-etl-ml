name: CI - Tests and Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ develop ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pylint black
      
      - name: Lint with black
        run: |
          black --check src/
      
      - name: Lint with pylint
        run: |
          pylint src/ --fail-under=8.0 || true
      
      - name: Run tests
        run: |
          pytest tests/ -v || echo "No tests yet"
      
      - name: Validate SQL syntax
        run: |
          # Verificar que los archivos SQL no tengan errores obvios
          for file in sql/*.sql; do
            echo "Validating $file..."
            # Verificar que tenga GO statements
            grep -q "GO" "$file" && echo "✓ $file OK" || echo "⚠ $file might be invalid"
          done
