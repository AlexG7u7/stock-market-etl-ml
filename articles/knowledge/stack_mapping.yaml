literature_vs_our_target:
  note: |
    La literatura mezcla dos tareas distintas:
    (A) Regresión de precio (RMSE, MAPE) — Quadir 2023, mayoría DL papers
    (B) Clasificación direccional / señales (AUC, Sharpe) — RL papers, nuestro enfoque

    Nuestro proyecto está alineado con (B), que es más accionable para trading.
    No debemos optimizar RMSE de precio — debemos optimizar AUC direccional y Sharpe neto de costos.
