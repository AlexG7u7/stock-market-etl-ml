schedule:
  incremental_hour_utc: 22
  days_of_week: "1-5"

incremental:
  lookback_days: 1
  auto_resume: true

historical:
  default_start_date: "2024-01-01"
  test_limit: 10
  sleep_between_tickers: 1

logging:
  level: INFO
  format: '%(asctime)s | %(name)s | %(levelname)s | %(message)s'
