# Configuración General del Proyecto ETL
# Este archivo contiene configuraciones que no son secretas

# API DataBursatil
api:
  base_url: "https://api.databursatil.com/v2"
  timeout: 30
  max_retries: 3
  retry_delay: 5
  rate_limit:
    requests_per_minute: 60
    cooldown_seconds: 2

# ETL Configuración
etl:
  batch_size: 50
  max_workers: 4
  chunk_size: 1000
  
  historico:
    default_start_date: "2020-01-01"
    max_days_per_request: 365
    
  cotidiano:
    lookback_days: 5  # Días hacia atrás para verificar
    schedule_time: "19:00"
    trading_days: [1, 2, 3, 4, 5]  # Lunes a Viernes

# Validación de Datos
validation:
  allow_null_volume: true
  min_price: 0.01
  max_price: 1000000
  outlier_threshold: 3  # Desviaciones estándar
  
  quality_checks:
    - gaps
    - duplicates
    - outliers
    - null_values

# Tickers a seguir
tickers:
  ipc_components:
    - "WALMEX*"
    - "AMXB"
    - "CEMEXCPO"
    - "GFNORTEO"
    - "FEMSAUBD"
    - "AC*"
    - "GFINBURO"
    - "GCARSOA1"
    - "GAPB"
    - "ASURB"
    - "BIMBOA"
    - "ALFAA"
    - "ALSEA*"
    - "GMEXICOB"
    - "TLEVISACPO"
    - "KOFUBL"
    - "ORBIA*"
    - "PINFRA*"
    
  custom:
    - "AAPL*"  # Ejemplo mercado global
    - "NFLX*"
    
# Machine Learning Features
ml_features:
  technical_indicators:
    - "SMA_20"
    - "SMA_50"
    - "RSI_14"
    - "MACD"
    - "BB_upper"
    - "BB_lower"
    
  fundamental:
    - "P/E"
    - "ROE"
    - "Debt/Equity"

# Logging
logging:
  version: 1
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    - console
    - file
  
# Notificaciones
notifications:
  enabled: false
  email: "tu_email@example.com"
  on_error: true
  on_success: false
